component: Product

variants:
  default:
    args:
      product: IQ2i\StoriaBundle\Tests\TestApplication\Factory\ProductFactory::createDefault
    blocks:
      content: ''

  expensive:
    args:
      product: !data IQ2i\StoriaBundle\Tests\TestApplication\Factory\ProductFactory::createExpensive
    blocks:
      content: ''

  outOfStock:
    args:
      product: !data IQ2i\StoriaBundle\Tests\TestApplication\Factory\ProductFactory::createOutOfStock
    blocks:
      content: ''

  static:
    args:
      product:
        id: 99
        name: Static Product
        price: 19.99
        inStock: true
    blocks:
      content: ''

  from_data:
    args:
      product: !data product.expensive
    blocks:
      content: ''

  php_tag:
    args:
      product: !data IQ2i\StoriaBundle\Tests\TestApplication\Factory\ProductFactory::createDefault
    blocks:
      content: ''

  special_characters:
    args:
      product:
        id: '007'
        name: 'It''s a café "quoted" {{ 7*7 }}'
        price: 5
        inStock: false
    blocks:
      content: ''
